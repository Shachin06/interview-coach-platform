# Server Configuration
server.port=8080

# Spring DataSource (H2 In-Memory Database for zero-config startup)
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Configuration (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Configs
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Configurations (For mock interview video clips)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Secrets Configuration
app.jwt.secret=9a76a982ba36717a6c9878dcbcbbcb6b9a76a982ba36717a6c9878dcbcbbcb6b
app.jwt.expiration-ms=86400000

# OpenAI API Integration (Leave blank to use mock evaluation mode automatically)
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions

# AWS S3 Storage Integration (Leave blank to use local data/uploads/ folder fallback automatically)
aws.s3.bucket=
aws.s3.access-key=
aws.s3.secret-key=

# Redis Cache Integration (Leave blank to use in-memory ConcurrentHashMap cache fallback automatically)
spring.data.redis.host=
spring.data.redis.port=6379

# Log levels
logging.level.org.springframework.security=INFO
